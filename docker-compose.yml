services:
  acgo:
    image: ${ACGO_IMAGE:-ghcr.io/yz0812/acgo:2.0.0}
    container_name: acgo
    restart: unless-stopped
    init: true
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 150s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据库
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
